[defaults]
inventory        = inventory.yml
remote_user      = ansible
roles_path       = roles
verbosity        = 1
host_key_checking = True
# Pliki *.sops.yml w group_vars/host_vars są odszyfrowywane w locie kluczem age.
# Żadnych sekretów w jawnej postaci na dysku i żadnego osobnego kroku deszyfrowania.
vars_plugins_enabled = host_group_vars,community.sops.sops

[privilege_escalation]
become = true

[ssh_connection]
# Cała topologia połączeń (port, ProxyJump przez hosta Proxmoxa) siedzi w ssh_config,
# nie w inventory. Dzięki temu `ssh k3s-server-1` z terminala działa tak samo jak Ansible.
ssh_args    = -F ssh_config -o ControlMaster=auto -o ControlPersist=120s
pipelining  = true
