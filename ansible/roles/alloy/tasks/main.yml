- name: Create the APT keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"
  tags: [alloy, logs]

- name: Download the Grafana GPG key
  ansible.builtin.get_url:
    url: https://apt.grafana.com/gpg.key
    dest: /etc/apt/keyrings/grafana.asc
    mode: "0644"
  tags: [alloy, logs]

- name: Add the Grafana repository
  ansible.builtin.deb822_repository:
    name: grafana
    types: [deb]
    uris: https://apt.grafana.com
    suites: [stable]
    components: [main]
    signed_by: /etc/apt/keyrings/grafana.asc
    enabled: true
    state: present
  tags: [alloy, logs]

- name: Install Alloy
  ansible.builtin.apt:
    name: alloy
    state: present
    update_cache: true
  tags: [alloy, logs]

# Alloy działa jako użytkownik `alloy`. Żeby czytać journald i gniazdo Dockera,
# musi należeć do odpowiednich grup - inaczej startuje, ale nie zbiera niczego.
- name: Add Alloy to the systemd-journal and docker groups
  ansible.builtin.user:
    name: alloy
    groups: "{{ ['systemd-journal'] + (['docker'] if 'docker' in group_names else []) }}"
    append: true
  tags: [alloy, logs]

- name: Generate configuration
  ansible.builtin.template:
    src: config.alloy.j2
    dest: /etc/alloy/config.alloy
    mode: "0644"
    validate: "alloy fmt %s"
  notify: restart alloy
  tags: [alloy, logs]

- name: Enable Alloy
  ansible.builtin.systemd_service:
    name: alloy
    state: started
    enabled: true
  tags: [alloy, logs]
