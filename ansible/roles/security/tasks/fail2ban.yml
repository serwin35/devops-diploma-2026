- name: Zainstaluj fail2ban
  ansible.builtin.apt:
    name: fail2ban
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Skonfiguruj jail dla SSH
  ansible.builtin.template:
    src: jail.local.j2
    dest: /etc/fail2ban/jail.local
    mode: "0644"
  notify: restart fail2ban

- name: Włącz fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: true
