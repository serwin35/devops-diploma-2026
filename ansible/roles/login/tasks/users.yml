- name: Collect personal accounts from the keys directory
  ansible.builtin.set_fact:
    human_users: >-
      {{
        query('fileglob', human_keys_glob)
        | map('basename') | map('splitext') | map('first')
        | list
      }}

- name: Create personal accounts
  ansible.builtin.user:
    name: "{{ item }}"
    shell: /bin/bash
    # Logowanie wyłącznie kluczem - hasło zablokowane, nie puste.
    password: "!"
    create_home: true
  loop: "{{ human_users }}"

- name: Distribute public keys
  ansible.posix.authorized_key:
    user: "{{ item }}"
    key: "{{ lookup('file', '../keys/humans/' ~ item ~ '.pub') }}"
    state: present
    exclusive: true
  loop: "{{ human_users }}"
