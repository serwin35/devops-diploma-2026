# Użytkownicy dopisywani do grupy docker. Członkostwo w tej grupie jest równoważne
# uprawnieniom roota - stąd wyłącznie konto maszynowe.
docker_users:
  - ansible

docker_data_root: /var/lib/docker

# Bez limitu logi kontenerów rosną bez końca i potrafią zapełnić dysk.
docker_log_max_size: 10m
docker_log_max_file: 3

# Metryki demona Dockera. Bindowane na adres prywatny, nie 0.0.0.0 - tak samo
# jak node_exporter i cAdvisor. Endpoint wystawia nazwy kontenerów, obrazów
# i wolumenów, czyli mapę tego, co na maszynie działa.
docker_metrics_port: 9323

# 8081, nie 8080: na maszynie CI/CD port 8080 należy do Jenkinsa. Tunel
# Cloudflare kierował jenkins.wolffire.dev prosto na cAdvisora.
cadvisor_port: 8081
cadvisor_image: gcr.io/cadvisor/cadvisor:v0.55.1
