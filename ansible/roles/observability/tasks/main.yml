# Rola leci na wszystkie maszyny - każda musi być widoczna dla Prometheusa.
# Metryki kontenerów (cAdvisor) tylko tam, gdzie faktycznie stoi Docker.

- name: Install node_exporter
  ansible.builtin.apt:
    name: prometheus-node-exporter
    state: present
    update_cache: true
    cache_valid_time: 3600
  tags: [observability]

# private_ip z inventory, NIE ansible_default_ipv4: na bastionie domyślna trasa
# idzie przez interfejs publiczny i fakt wskazywałby adres 51.83.139.3 -
# node_exporter przestałby być osiągalny dla Prometheusa (scrapuje 10.0.110.10).
- name: Set the node_exporter listen address
  ansible.builtin.copy:
    dest: /etc/default/prometheus-node-exporter
    mode: "0644"
    content: |
      # Zarządzane przez Ansible.
      ARGS="--web.listen-address={{ private_ip }}:{{ node_exporter_port }} --collector.systemd"
  notify: restart node_exporter
  tags: [observability]

- name: Enable node_exporter
  ansible.builtin.service:
    name: prometheus-node-exporter
    state: started
    enabled: true
  tags: [observability]
