# Token tunelu NIE jest kopiowany do SOPS-a.
#
# SOPS trzyma sekrety pochodzące z zewnątrz - tokeny API, klucze dostępu. Token
# tunelu generuje Terraform, więc jego źródłem prawdy jest stan. Skopiowany do
# SOPS-a stałby się drugim źródłem i rozjechał przy odtworzeniu tunelu - a objaw
# pojawiłby się dopiero wtedy, gdy cloudflared przestanie się łączyć.
#
# Odczyt idzie ze stanu w S3 przy każdym uruchomieniu, więc zawsze jest aktualny.
#
# check_mode: false, bo to czysty odczyt stanu - nic nie modyfikuje, tak jak
# każdy moduł *_info. Bez tego w --check zadanie jest pomijane, rejestr nie ma
# klucza `value`, a następne set_fact wywala cały przebieg. Odczyt w trybie
# sprawdzania jest bezpieczny i dopiero on pozwala sensownie sprawdzić
# resztę roli (plik z tokenem, jednostka systemd).
- name: Odczytaj tokeny tuneli ze stanu Terraforma
  cloud.terraform.terraform_output:
    project_path: "{{ terraform_project_path }}"
    name: cloudflare_tunnel_tokens
  delegate_to: localhost
  become: false
  run_once: true
  no_log: true
  check_mode: false
  register: tunnel_tokens
  tags: [cloudflared]

# Każda maszyna ma własny tunel, więc bierze własny token z mapy.
- name: Wybierz token dla tunelu tej maszyny
  ansible.builtin.set_fact:
    tunnel_token_value: "{{ tunnel_tokens.value[cloudflared_tunnel_name] }}"
  no_log: true
  tags: [cloudflared]

- name: Załóż użytkownika usługi
  ansible.builtin.user:
    name: cloudflared
    system: true
    shell: /usr/sbin/nologin
    create_home: false
  tags: [cloudflared]

- name: Utwórz katalog na klucze APT
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"
  tags: [cloudflared]

- name: Pobierz klucz GPG Cloudflare
  ansible.builtin.get_url:
    url: https://pkg.cloudflare.com/cloudflare-main.gpg
    dest: /etc/apt/keyrings/cloudflare-main.gpg
    mode: "0644"
  tags: [cloudflared]

- name: Dodaj repozytorium cloudflared
  ansible.builtin.deb822_repository:
    name: cloudflared
    types: [deb]
    uris: https://pkg.cloudflare.com/cloudflared
    suites: [any]
    components: [main]
    signed_by: /etc/apt/keyrings/cloudflare-main.gpg
    enabled: true
    state: present
  tags: [cloudflared]

- name: Zainstaluj cloudflared
  ansible.builtin.apt:
    name: cloudflared
    state: present
    update_cache: true
  tags: [cloudflared]

- name: Utwórz katalog konfiguracji
  ansible.builtin.file:
    path: "{{ cloudflared_config_dir }}"
    state: directory
    mode: "0750"
    owner: root
    group: cloudflared
  tags: [cloudflared]

# Token w pliku środowiskowym, nie w linii polecenia jednostki - inaczej byłby
# widoczny w `ps` dla każdego użytkownika maszyny.
- name: Zapisz token tunelu
  ansible.builtin.copy:
    dest: "{{ cloudflared_config_dir }}/env"
    owner: root
    group: cloudflared
    mode: "0640"
    content: "TUNNEL_TOKEN={{ tunnel_token_value }}\n"
  no_log: true
  notify: restart cloudflared
  tags: [cloudflared]

- name: Zainstaluj jednostkę systemd
  ansible.builtin.copy:
    dest: /etc/systemd/system/cloudflared.service
    mode: "0644"
    content: |
      # Zarządzane przez Ansible.
      [Unit]
      Description=Cloudflare Tunnel
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=notify
      EnvironmentFile={{ cloudflared_config_dir }}/env
      # Konfiguracja ingressu żyje po stronie Cloudflare (config_src = "cloudflare"),
      # więc tutaj nie ma pliku z regułami - tylko token.
      ExecStart=/usr/bin/cloudflared --no-autoupdate tunnel run
      Restart=always
      RestartSec=5
      User=cloudflared
      Group=cloudflared
      NoNewPrivileges=true
      ProtectSystem=strict
      ProtectHome=true
      PrivateTmp=true

      [Install]
      WantedBy=multi-user.target
  notify:
    - reload systemd
    - restart cloudflared
  tags: [cloudflared]

- name: Włącz cloudflared
  ansible.builtin.systemd_service:
    name: cloudflared
    state: started
    enabled: true
    daemon_reload: true
  tags: [cloudflared]

# Tunel zestawia się wychodząco, więc "uruchomiony" nie znaczy jeszcze "połączony".
- name: Sprawdź, czy usługa się utrzymuje
  ansible.builtin.command: systemctl is-active cloudflared
  register: cf_active
  changed_when: false
  retries: 6
  delay: 5
  until: cf_active.stdout == "active"
  # Weryfikacja jest odczytem, więc idzie także w --check. Inaczej zadanie
  # zostaje pominięte, rejestr jest pusty i until/failed_when wywala przebieg.
  check_mode: false
  tags: [cloudflared]
