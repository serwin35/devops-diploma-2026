# Wrażliwa część konfiguracji. Wartości wchodzą przez values (--set albo plik
# values z pipeline'u), nigdy na sztywno w repo.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "wolffire.fullname" . }}-env
  labels:
    {{- include "wolffire.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- include "wolffire.secretEnv" . | nindent 2 }}
