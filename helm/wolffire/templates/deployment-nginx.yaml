# nginx - statyki z obrazu plus proxy fastcgi do php-fpm.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "wolffire.fullname" . }}-nginx
  labels:
    {{- include "wolffire.labels" . | nindent 4 }}
    app.kubernetes.io/component: nginx
spec:
  replicas: {{ .Values.nginx.replicaCount }}
  selector:
    matchLabels:
      {{- include "wolffire.selectorLabels" (dict "ctx" . "component" "nginx") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "wolffire.selectorLabels" (dict "ctx" . "component" "nginx") | nindent 8 }}
      annotations:
        # nginx nie przeładowuje configu sam - zmiana configmapy musi
        # przejść przez rollout.
        checksum/nginx-config: {{ include (print $.Template.BasePath "/configmap-nginx.yaml") . | sha256sum }}
    spec:
      imagePullSecrets:
        - name: {{ include "wolffire.fullname" . }}-ghcr
      securityContext:
        {{- include "wolffire.podSecurityContext" . | nindent 8 }}
      containers:
        - name: nginx
          image: {{ include "wolffire.nginxImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "wolffire.containerSecurityContext" . | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
          # /up przechodzi przez fastcgi do Laravela, więc readiness pokrywa
          # całą ścieżkę nginx -> php -> aplikacja. Liveness celowo tylko TCP:
          # restart nginxa nie naprawi leżącego php, a /up w liveness
          # ubijałoby zdrowe pody nginx przy każdej awarii backendu.
          readinessProbe:
            httpGet:
              path: /up
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.nginx.resources | nindent 12 }}
          volumeMounts:
            # subPath: podmieniamy wyłącznie default.conf, reszta conf.d
            # zostaje z obrazu. Aktualizacje i tak wchodzą rolloutem
            # (checksum wyżej), więc brak live-propagacji subPath nie boli.
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
      volumes:
        - name: nginx-config
          configMap:
            name: {{ include "wolffire.fullname" . }}-nginx
