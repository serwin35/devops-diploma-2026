# Poświadczenia do prywatnego GHCR. Chart tworzy Secret sam, zamiast wymagać
# ręcznego `kubectl create secret docker-registry` przed instalacją - dzięki
# temu cały deployment odtwarza się jedną komendą helm.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "wolffire.fullname" . }}-ghcr
  labels:
    {{- include "wolffire.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ include "wolffire.imagePullSecretData" . }}
